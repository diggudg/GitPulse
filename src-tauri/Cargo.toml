[package]
name = "gitpulse"
version = "0.1.0"
description = "GitPulse — a high-performance desktop Git client"
authors = ["GitPulse"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitpulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Git engines: gix (gitoxide) for fast reads, git2 (libgit2) for write fallback.
gix = { version = "0.66", default-features = false, features = ["max-performance-safe", "blob-diff", "revision"] }
git2 = "0.19"
rayon = "1"
thiserror = "1"
tauri-plugin-shell = "2.3.5"

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
